<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Agent Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="grid-overlay"></div>

  <main class="container">
    <section class="hero">
      <div>
        <p class="kicker">AI Multi-Agent Market Console</p>
        <h1 id="report-date">Daily Report</h1>
      </div>
      <div class="risk-pill" id="risk-pill">Risk: --</div>
    </section>

    <section class="cards" id="metric-cards">
      <article class="card">
        <h3>Total Positions</h3>
        <p id="metric-positions">--</p>
      </article>
      <article class="card">
        <h3>Portfolio Value</h3>
        <p id="metric-value">--</p>
      </article>
      <article class="card">
        <h3>Risk Score</h3>
        <p id="metric-risk">--</p>
      </article>
      <article class="card">
        <h3>Model</h3>
        <p id="metric-model">--</p>
      </article>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>Allocation</h2>
        <canvas id="allocationChart"></canvas>
      </article>
      <article class="panel">
        <h2>Recommendations</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ticker</th>
                <th>Action</th>
                <th>Confidence</th>
                <th>Weight</th>
              </tr>
            </thead>
            <tbody id="recommendation-body"></tbody>
          </table>
        </div>
      </article>
      <article class="panel">
        <h2>RSI Snapshot</h2>
        <canvas id="rsiChart"></canvas>
      </article>
      <article class="panel">
        <h2>Sentiment</h2>
        <canvas id="sentimentChart"></canvas>
      </article>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
